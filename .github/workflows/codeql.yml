name: CodeQL

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
  push:
      branches: [ "master" ]
  schedule:
    # Weekly schedule
    - cron: '43 7 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: "Run CodeQL"
    uses: govuk-pay/pay-ci/.github/workflows/_run-codeql-scan.yml@d2c103d4bb42d978f158ff2c1a664c3f6b581b99
    with:
      is_java_repo: true
