name: CodeQL

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
  push:
      branches: [ "master" ]
  schedule:
    # Weekly schedule
    - cron: '43 7 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: "Run CodeQL"
    uses: govuk-pay/pay-ci/.github/workflows/_run-codeql-scan.yml@042a7e3d823df3b1ba6cbab336f97c07e65dc4e9
    with:
      is_java_repo: true
